<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ingreso al Sistema</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    width:400px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#004B87;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    margin-top:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#004B87;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003b6a;
}

#mensaje{
    margin-top:15px;
    text-align:center;
    color:red;
}

</style>
</head>

<body>

<div class="card">

    <h2>Ingreso al Sistema</h2>

    <input
        type="email"
        id="email"
        placeholder="correo@atlascopco.com">

    <button onclick="ingresar()">
        Ingresar
    </button>

    <div id="mensaje"></div>

</div>

<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

async function ingresar(){

    const mensaje =
        document.getElementById("mensaje");

    mensaje.innerHTML = "";

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    if(!email){

        mensaje.innerHTML =
            "Ingrese un correo válido";

        return;
    }

    try{

        const response = await fetch(
            `${URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}&select=email,perfil`,
            {
                method:"GET",
                headers:{
                    "apikey": APIKEY,
                    "Authorization": `Bearer ${APIKEY}`,
                    "Content-Type":"application/json"
                }
            }
        );

        const texto = await response.text();

        console.log("STATUS:", response.status);
        console.log("RESPUESTA:", texto);

        if(!response.ok){

            throw new Error(
                `Error ${response.status}`
            );
        }

        const usuarios =
            JSON.parse(texto);

        if(usuarios.length === 0){

            mensaje.innerHTML =
                "Usuario no autorizado";

            return;
        }

        const usuario =
            usuarios[0];

        localStorage.setItem(
            "email",
            usuario.email
        );

        localStorage.setItem(
            "perfil",
            usuario.perfil
        );

        if(usuario.perfil === "ADMIN"){

            window.location.href =
                "index.html";

        }
        else if(
            usuario.perfil === "CONSULTA"
        ){

            window.location.href =
                "Consulta.html";

        }
        else{

            mensaje.innerHTML =
                "Perfil no válido";
        }

    }
    catch(error){

        console.error(error);

        mensaje.innerHTML =
            "Error: " + error.message;
    }
}

document
.getElementById("email")
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){
            ingresar();
        }

    }
);

</script>

</body>
</html>
