<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ingreso</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:#004B87;
    color:white;
    border:none;
    cursor:pointer;
}

.errores{
    color:red;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="card">

    <h2>Ingreso al Sistema</h2>

    <input
        type="email"
        id="email"
        placeholder="correo@atlascopco.com">

    <button onclick="ingresar()">
        Ingresar
    </button>

    <div id="mensaje" class="errores"></div>

</div>

<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";


const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

async function ingresar() {

    try {

        const email = document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const response = await fetch(
            `${URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}&select=*`,
            {
                method: "GET",
                headers: {
                    "apikey": APIKEY,
                    "Authorization": `Bearer ${APIKEY}`,
                    "Content-Type": "application/json"
                }
            }
        );

        const datos = await response.json();

        console.log(datos);

        if (
            datos.length > 0 &&
            datos[0].perfil === "ADMIN"
        ) {

            window.location.href = "index.html";

        } else {

            window.location.href = "Consulta.html";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("mensaje").innerHTML =
            error.message;

    }

}

</script>

</body>
</html>
