<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso al Sistema</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:#fff;
    padding:30px;
    border-radius:10px;
    width:380px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#004B87;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#004B87;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#003863;
}

#mensaje{
    margin-top:15px;
    color:red;
    text-align:center;
}
</style>

</head>

<body>

<div class="card">

    <h2>Ingreso al Sistema</h2>

    <input
        type="email"
        id="email"
        placeholder="correo@atlascopco.com">

    <button id="btnIngresar">
        Ingresar
    </button>

    <div id="mensaje"></div>

</div>

<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

async function ingresar() {

    const mensaje =
        document.getElementById("mensaje");

    mensaje.innerHTML = "";

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    if (!email) {

        mensaje.innerHTML =
            "Ingrese un correo electrónico";

        return;
    }

    try {

        const response = await fetch(
            `${URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}&select=*`,
            {
                method: "GET",
                headers: {
                    apikey: APIKEY,
                    Authorization: `Bearer ${APIKEY}`,
                    "Content-Type": "application/json"
                }
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            console.log(errorText);

            throw new Error(
                `Error ${response.status}`
            );
        }

        const datos =
            await response.json();

        console.log(datos);

        if (datos.length === 0) {

            mensaje.innerHTML =
                "Usuario no autorizado";

            return;
        }

        const usuario = datos[0];

        localStorage.setItem(
            "email",
            usuario.email
        );

        localStorage.setItem(
            "perfil",
            usuario.perfil
        );

        if (usuario.perfil === "ADMIN") {

            window.location.href =
                "index.html";

        } else {

            window.location.href =
                "Consulta.html";

        }

    } catch (error) {

        console.error(error);

        mensaje.innerHTML =
            error.message;
    }
}

document
.getElementById("btnIngresar")
.addEventListener("click", ingresar);

document
.getElementById("email")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        ingresar();
    }

});

</script>

</body>
</html>
