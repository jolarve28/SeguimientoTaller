<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas Copco - Gestión de Equipos F.E.A.S</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;
}

body{
    background-image:url('https://jolarve28.github.io/SeguimientoTaller/FONDO.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:20px;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(225,232,240,.40);
    z-index:1;
}

.login-card{
    background:#ffffff;
    width:100%;
    max-width:440px;
    padding:45px 35px;
    border-radius:16px;
    box-shadow:0 20px 40px rgba(15,34,53,.25);
    text-align:center;
    position:relative;
    z-index:10;
}

.logo-container{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.brand-logo-img{
    width:210px;
}

.subtitle{
    color:#0c3866;
    font-size:24px;
    font-weight:700;
    margin-bottom:28px;
}

.form-group{
    text-align:left;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:6px;
}

.input-wrapper{
    position:relative;
}

input{
    width:100%;
    padding:13px 16px;
    border:2px solid #b4c7d7;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    border-color:#004B87;
    outline:none;
}

.input-password{
    background:#f4f6f8;
}

.toggle-password{
    position:absolute;
    right:42px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#004B87;
    font-size:13px;
    font-weight:600;
}

.icon-key{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#9ca3af;
}

.btn-submit{
    width:100%;
    border:none;
    border-radius:8px;
    padding:15px;
    cursor:pointer;
    background:#11468f;
    color:#fff;
    font-size:15px;
    font-weight:600;
}

.btn-submit:hover{
    background:#0d356b;
}

.error{
    display:none;
    color:#dc2626;
    margin-bottom:15px;
}

.success{
    display:none;
    color:#16a34a;
    margin-bottom:15px;
}

.links-container{
    margin-top:20px;
}

.link-item{
    color:#6b7280;
    text-decoration:none;
    font-size:13px;
}

.footer-text{
    position:relative;
    z-index:10;
    margin-top:20px;
}

</style>
</head>
<body>

<div class="login-card">

    <div class="logo-container">
        <img
            src="https://images.seeklogo.com/logo-png/1/1/atlas-copco-service-logo-png_seeklogo-13057.png"
            class="brand-logo-img"
            alt="Atlas Copco">
    </div>

    <h2 class="subtitle">
        Gestión de Equipos<br>
        F.E.A.S
    </h2>

    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>

    <form id="loginForm">

        <div class="form-group">
            <label>Usuario</label>
            <div class="input-wrapper">
                <input
                    type="email"
                    id="usuario"
                    placeholder="correo@empresa.com"
                    required>
            </div>
        </div>

        <div class="form-group">
            <label>Contraseña</label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="contrasena"
                    class="input-password"
                    placeholder="••••••••"
                    required>

                <span
                    class="toggle-password"
                    onclick="mostrarPassword()">
                    VER
                </span>

                <svg class="icon-key"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>

            </div>
        </div>

        <button type="submit" class="btn-submit">
            INGRESAR
        </button>

    </form>

    <div class="links-container">
        <a href="#" class="link-item">
            ¿Olvidaste tu contraseña?
        </a>
    </div>

</div>

<p class="footer-text">
© 2026 Atlas Copco
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   DATOS DE SUPABASE
================================ */



const SUPABASE_URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* ================================
   MOSTRAR PASSWORD
================================ */

function mostrarPassword(){

    const campo =
    document.getElementById("contrasena");

    campo.type =
        campo.type === "password"
        ? "text"
        : "password";
}

/* ================================
   LOGIN
================================ */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const errorDiv =
    document.getElementById("errorMsg");

    errorDiv.style.display = "none";

    const email =
    document
    .getElementById("usuario")
    .value
    .trim();

    const password =
    document
    .getElementById("contrasena")
    .value
    .trim();

    try{

        const { data, error } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq("email", email)
            .single();

        console.log(data);
        console.log(error);

        if(error || !data){

            errorDiv.innerHTML =
            "Usuario no encontrado";

            errorDiv.style.display =
            "block";

            return;
        }

        if(data.contraseña !== password){

            errorDiv.innerHTML =
            "Contraseña incorrecta";

            errorDiv.style.display =
            "block";

            return;
        }

        sessionStorage.setItem(
            "usuario",
            JSON.stringify(data)
        );

        window.location.href =
        "portal.html";

    }
    catch(err){

        console.error(err);

        errorDiv.innerHTML =
        "Error de conexión con Supabase";

        errorDiv.style.display =
        "block";
    }

});

</script>

</body>
</html>
