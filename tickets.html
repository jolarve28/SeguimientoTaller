<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Gestión Tickets</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.card-kpi{
    color:white;
    border-radius:18px;
    transition:.3s;
}

.card-kpi:hover{
    transform:translateY(-4px);
}

.kpi-total{
    background:linear-gradient(135deg,#0d6efd,#4f8cff);
}

.kpi-cerrado{
    background:linear-gradient(135deg,#198754,#3fd38c);
}

.kpi-progreso{
    background:linear-gradient(135deg,#ff9800,#ffc107);
}

.kpi-abierto{
    background:linear-gradient(135deg,#dc3545,#ff6b81);
}

canvas{
    max-height:420px;
}

.table{
    font-size:13px;
}

thead{
    position:sticky;
    top:0;
    z-index:10;
}

.estado-open{
    color:#dc3545;
    font-weight:bold;
}

.estado-closed{
    color:#198754;
    font-weight:bold;
}

.estado-pending{
    color:#ff9800;
    font-weight:bold;
}

.estado-progress{
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<h1 class="mb-4">Dashboard Gestión Tickets</h1>

<div class="row mb-4">

<div class="col-md-3">
<div class="card card-kpi kpi-total">
<div class="card-body">
<h6>Total Casos</h6>
<h1 id="totalCasos">0</h1>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi kpi-cerrado">
<div class="card-body">
<h6>Cerrados</h6>
<h1 id="cerrados">0</h1>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi kpi-progreso">
<div class="card-body">
<h6>En Progreso</h6>
<h1 id="progreso">0</h1>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi kpi-abierto">
<div class="card-body">
<h6>Abiertos</h6>
<h1 id="abiertos">0</h1>
</div>
</div>
</div>

</div>

<div class="row">

<div class="col-lg-6 mb-4">

<div class="card">
<div class="card-body">

<canvas id="estadoChart"></canvas>

</div>
</div>

</div>

<div class="col-lg-6 mb-4">

<div class="card">
<div class="card-body">

<canvas id="agenteChart"></canvas>

</div>
</div>

</div>

</div>

<div class="row mb-4">

<div class="col-12">

<div class="card">

<div class="card-body">

<canvas id="prioridadChart"></canvas>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-header">
<h4>Listado de Tickets</h4>
</div>

<div class="card-body table-responsive">

<table class="table table-striped table-hover table-bordered">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Estado</th>
<th>Agente</th>
<th>Prioridad</th>
<th>Resumen</th>
</tr>

</thead>

<tbody id="tbodyTickets"></tbody>

</table>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let estadoChart;
let agenteChart;
let prioridadChart;

async function cargarTickets(){

    const {data,error} =
    await supabaseClient
    .from("tickets")
    .select("*");

    if(error){
        console.error(error);
        return;
    }

    document.getElementById("totalCasos")
    .innerText = data.length;

    let abiertos = 0;
    let cerrados = 0;
    let progreso = 0;

    const estados = {};
    const agentes = {};
    const prioridades = {};

    const tbody =
    document.getElementById("tbodyTickets");

    tbody.innerHTML = "";

    data.forEach(ticket=>{

        const estado =
        ticket.status_icon || "Sin Estado";

        estados[estado] =
        (estados[estado] || 0) + 1;

        const estadoLower =
        estado.toLowerCase();

        if(estadoLower.includes("open"))
            abiertos++;

        if(estadoLower.includes("closed"))
            cerrados++;

        if(
            estadoLower.includes("pending") ||
            estadoLower.includes("progress")
        )
            progreso++;

        const agente =
        ticket.Agent || "Sin Asignar";

        agentes[agente] =
        (agentes[agente] || 0) + 1;

        const prioridad =
        ticket.Priority || "Sin Prioridad";

        prioridades[prioridad] =
        (prioridades[prioridad] || 0) + 1;

        tbody.innerHTML += `

        <tr>

            <td>${ticket.id}</td>

            <td>${ticket.status_icon || ''}</td>

            <td>${ticket.Agent || ''}</td>

            <td>${ticket.Priority || ''}</td>

            <td>${ticket.Summary || ''}</td>

        </tr>

        `;
    });

    document.getElementById("abiertos")
    .innerText = abiertos;

    document.getElementById("cerrados")
    .innerText = cerrados;

    document.getElementById("progreso")
    .innerText = progreso;

    const coloresEstado = {
        "Open":"#dc3545",
        "Closed":"#198754",
        "Pending":"#ffc107",
        "In Progress":"#0d6efd",
        "Resolved":"#20c997",
        "Sin Estado":"#6c757d"
    };

    const estadoLabels =
    Object.keys(estados);

    const estadoValores =
    Object.values(estados);

    const estadoColors =
    estadoLabels.map(
        e=> coloresEstado[e] || "#6610f2"
    );

    if(estadoChart)
        estadoChart.destroy();

    estadoChart = new Chart(
        document.getElementById("estadoChart"),
        {
            type:"doughnut",

            data:{
                labels:estadoLabels,

                datasets:[{
                    data:estadoValores,
                    backgroundColor:estadoColors,
                    borderColor:"#ffffff",
                    borderWidth:3
                }]
            },

            options:{
                responsive:true,

                plugins:{

                    title:{
                        display:true,
                        text:"Distribución por Estado"
                    },

                    legend:{
                        position:"right"
                    }
                }
            }
        }
    );

    const agentesOrdenados =
    Object.entries(agentes)
    .sort((a,b)=>b[1]-a[1]);

    if(agenteChart)
        agenteChart.destroy();

    agenteChart = new Chart(
        document.getElementById("agenteChart"),
        {
            type:"bar",

            data:{

                labels:
                agentesOrdenados.map(x=>x[0]),

                datasets:[{

                    label:"Tickets",

                    data:
                    agentesOrdenados.map(x=>x[1]),

                    backgroundColor:
                    agentesOrdenados.map(x=>{

                        if(x[1] > 70)
                            return "#198754";

                        if(x[1] > 40)
                            return "#0d6efd";

                        if(x[1] > 20)
                            return "#ffc107";

                        return "#dc3545";
                    }),

                    borderRadius:10

                }]
            },

            options:{

                indexAxis:"y",

                plugins:{

                    legend:{
                        display:false
                    },

                    title:{
                        display:true,
                        text:"Top Agentes por Cantidad de Tickets"
                    }
                }
            }
        }
    );

    if(prioridadChart)
        prioridadChart.destroy();

    prioridadChart = new Chart(
        document.getElementById("prioridadChart"),
        {
            type:"bar",

            data:{

                labels:
                Object.keys(prioridades),

                datasets:[{

                    label:"Tickets",

                    data:
                    Object.values(prioridades),

                    backgroundColor:[
                        "#dc3545",
                        "#ff9800",
                        "#ffc107",
                        "#198754",
                        "#0d6efd"
                    ]
                }]
            },

            options:{

                plugins:{

                    title:{
                        display:true,
                        text:"Distribución por Prioridad"
                    }
                }
            }
        }
    );
}

cargarTickets();

</script>

</body>
</html>
