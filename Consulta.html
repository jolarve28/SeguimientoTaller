<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Equipos</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#004B87;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004B87;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

.progress{
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:24px;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-align:center;
    line-height:24px;
}

.low{
    background:#dc3545;
}

.mid{
    background:#ff9800;
}

.high{
    background:#28a745;
}
</style>
</head>

<body>

<div class="header">
    <h1>Consulta Estado de Equipos</h1>
</div>

<div class="container">

    <div class="card">

        <div class="grid">

            <div>
                <label>Cliente</label>
                <input
                    id="filtroCliente"
                    placeholder="Buscar cliente"
                    onkeyup="filtrar()">
            </div>

            <div>
                <label>Serial</label>
                <input
                    id="filtroSerial"
                    placeholder="Buscar serial"
                    onkeyup="filtrar()">
            </div>

        </div>

    </div>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Equipo</th>
                    <th>Serial</th>
                    <th>Estado</th>
                    <th>Fecha Estimada</th>
                    <th>Progreso</th>
                    <th>Observaciones</th>
                </tr>
            </thead>

            <tbody id="tabla"></tbody>

        </table>

    </div>

</div>

<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

    
const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";




    
function getHeaders(){
    return {
        apikey: APIKEY,
        Authorization: `Bearer ${APIKEY}`
    };
}

async function cargarEquipos(){

    const response =
    await fetch(
        URL + "/rest/v1/equipos?select=*",
        {
            headers:getHeaders()
        }
    );

    const datos =
    await response.json();

    mostrarTabla(datos);

}

function mostrarTabla(datos){

    tabla.innerHTML="";

    datos.forEach(r=>{

        let color="high";

        if(r.progreso < 40)
            color="low";
        else if(r.progreso < 80)
            color="mid";

        tabla.innerHTML += `
        <tr>
            <td>${r.cliente}</td>
            <td>${r.equipo}</td>
            <td>${r.serial}</td>
            <td>${r.estado}</td>
            <td>${r.fecha_estimada || ""}</td>

            <td>
                <div class="progress">
                    <div
                        class="progress-bar ${color}"
                        style="width:${r.progreso}%">
                        ${r.progreso}%
                    </div>
                </div>
            </td>

            <td>${r.observaciones || ""}</td>
        </tr>
        `;

    });

}

function filtrar(){

    const cliente =
    document.getElementById("filtroCliente")
    .value
    .toLowerCase();

    const serial =
    document.getElementById("filtroSerial")
    .value
    .toLowerCase();

    document
    .querySelectorAll("#tabla tr")
    .forEach(fila=>{

        const texto =
        fila.innerText.toLowerCase();

        fila.style.display =
            texto.includes(cliente)
            &&
            texto.includes(serial)
            ? ""
            : "none";

    });

}

cargarEquipos();


</script>

    


</body>
</html>
