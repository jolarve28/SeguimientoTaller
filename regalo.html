<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Regalo de Cumpleaños</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#ff6b81;
      --text:#f8fafc;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg,#071021 0%, #0b1b2b 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .gift {
      width:100%;
      max-width:920px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.7);
      overflow:hidden;
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:0;
    }

    /* Left: slideshow */
    .slideshow {
      position:relative;
      min-height:420px;
      background:linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.25));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .slides {
      width:100%;
      height:100%;
      position:relative;
      border-radius:12px;
      overflow:hidden;
    }
    .slides img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transform:scale(1.03);
      transition:opacity .9s ease, transform .9s ease;
    }
    .slides img.active{
      opacity:1;
      transform:scale(1);
    }

    /* Right: message and controls */
    .panel{
      padding:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:flex-start;
      justify-content:center;
    }
    .title{
      font-size:20px;
      font-weight:700;
      color:var(--accent);
      letter-spacing:0.6px;
    }
    .message{
      font-size:18px;
      line-height:1.45;
      color:#e6eef8;
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:14px;
      border-radius:10px;
      width:100%;
    }
    .from{
      font-weight:600;
      color:#dbeafe;
      margin-top:6px;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:6px;
    }
    .btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.08);
      color:var(--text);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      transition:all .18s ease;
    }
    .btn:hover{transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,0.4)}
    .heart{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--accent);
      font-weight:700;
    }

    /* small footer */
    .footer{
      font-size:12px;
      color:rgba(255,255,255,0.55);
      margin-top:8px;
    }

    /* responsive */
    @media (max-width:880px){
      .gift{grid-template-columns:1fr; max-width:720px}
      .panel{order:2}
      .slideshow{order:1; min-height:360px}
    }
  </style>
</head>
<body>
  <div class="gift" role="region" aria-label="Regalo virtual de cumpleaños">
    <div class="slideshow">
      <div class="slides" id="slides">
        <!-- Reemplaza las rutas de imagen por tus fotos -->
        <img src="foto1.jpg" alt="Foto 1" class="active">
        <img src="foto2.jpg" alt="Foto 2">
       <img src="foto3.jpg" alt="Foto 3">
       <img src="foto4.jpg" alt="Foto 4">
       <img src="foto5.jpg" alt="Foto 5">
       <img src="foto6.jpg" alt="Foto 6">
       <img src="foto7.jpg" alt="Foto 7">
       <img src="foto8.jpg" alt="Foto 8">
       <img src="foto9.jpg" alt="Foto 9">
      </div>
    </div>

    <div class="panel">
      <div class="title">Feliz cumpleaños</div>

      <div class="message" id="message">
        Mi amor, cada día a tu lado es un regalo. Gracias por ser la mejor esposa y la mamá más tierna para nuestra hija. Te amamos con todo el corazón.
      </div>

      <div class="from">Con amor, <span id="fromText">Isa y Jorge</span></div>

      <div class="controls">
        <button class="btn" id="prevBtn" aria-label="Foto anterior">◀ Anterior</button>
        <button class="btn" id="playPauseBtn" aria-label="Pausar o reproducir">Pausar</button>
        <button class="btn" id="nextBtn" aria-label="Siguiente foto">Siguiente ▶</button>
      </div>

      <div class="footer">Gracias por el aguante se que no es facil y no soy perfecto pero quiero ser y seré mejor por ustedes las Amo !!!.</div>
    </div>
  </div>

  <script>
    // Configuración rápida
    const slideInterval = 4000; // ms
    let playing = true;
    const slides = Array.from(document.querySelectorAll('#slides img'));
    let index = 0;
    let timer = null;

    function showSlide(i){
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function next(){
      index = (index + 1) % slides.length;
      showSlide(index);
    }
    function prev(){
      index = (index - 1 + slides.length) % slides.length;
      showSlide(index);
    }

    function start(){
      if(timer) clearInterval(timer);
      timer = setInterval(next, slideInterval);
      playing = true;
      document.getElementById('playPauseBtn').textContent = 'Pausar';
    }
    function stop(){
      if(timer) clearInterval(timer);
      timer = null;
      playing = false;
      document.getElementById('playPauseBtn').textContent = 'Reproducir';
    }

    document.getElementById('nextBtn').addEventListener('click', () => { next(); if(playing){ stop(); } });
    document.getElementById('prevBtn').addEventListener('click', () => { prev(); if(playing){ stop(); } });
    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if(playing) stop(); else start();
    });

    // Inicia la reproducción automática
    start();

    // Opcional: permitir personalizar desde URL query params
    // ?msg=Tu%20frase&from=Esposa%20y%20Mariana
    (function applyQuery(){
      const params = new URLSearchParams(location.search);
      const msg = params.get('msg');
      const from = params.get('from');
      if(msg) document.getElementById('message').textContent = decodeURIComponent(msg);
      if(from) document.getElementById('fromText').textContent = decodeURIComponent(from);
    })();
  </script>
</body>
</html>
