<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Equipos Detenidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ background:#eef2f7; font-family:'Segoe UI',sans-serif; }
    .card{ border:none; border-radius:18px; box-shadow:0 8px 20px rgba(0,0,0,.08); }
    .card-kpi{ color:white; border-radius:18px; }
    .bg-detenido{ background:linear-gradient(135deg,#0d6efd,#4d8bff); }
    .bg-critico{ background:linear-gradient(135deg,#dc3545,#ff6b6b); }
    .bg-repuesto{ background:linear-gradient(135deg,#ffc107,#ffdb70); color:#000; }
    .bg-entrega{ background:linear-gradient(135deg,#198754,#45d48f); }
    .estado-verde{ background:#198754; color:white; padding:4px 10px; border-radius:8px; }
    .estado-amarillo{ background:#ffc107; color:black; padding:4px 10px; border-radius:8px; }
    .estado-rojo{ background:#dc3545; color:white; padding:4px 10px; border-radius:8px; }
    .table-responsive{ max-height:600px; }
  </style>
</head>
<body>
  <div class="container-fluid p-4">
    <h2 class="mb-4">Control de Equipos Detenidos</h2>

    <!-- KPIs -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card card-kpi bg-detenido">
          <div class="card-body">
            <h6>Equipos Detenidos</h6>
            <h2 id="kpiTotal">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-kpi bg-critico">
          <div class="card-body">
            <h6>Críticos (+30 días)</h6>
            <h2 id="kpiCriticos">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-kpi bg-repuesto">
          <div class="card-body">
            <h6>Espera Repuestos</h6>
            <h2 id="kpiRepuestos">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card card-kpi bg-entrega">
          <div class="card-body">
            <h6>Entrega Próxima</h6>
            <h2 id="kpiEntrega">0</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0" id="tituloFormulario">Registro de Equipo</h5>
        <button class="btn btn-sm btn-secondary d-none" id="btnCancelarEdicion" onclick="cancelarEdicion()">Cancelar Edición</button>
      </div>
      <div class="card-body">
        <input type="hidden" id="equipoId">
        <div class="row g-3">
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Modelo *</label>
            <input type="text" class="form-control" id="modelo" placeholder="Ej. CAT 320D" required>
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Serial</label>
            <input type="text" class="form-control" id="serial" placeholder="Serial único">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Cliente</label>
            <input type="text" class="form-control" id="cliente" placeholder="Nombre cliente">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Tipo Convenio</label>
            <select class="form-select" id="tipoConvenio">
              <option value="">Seleccione convenio...</option>
              <option value="Mantenimiento Preventivo">Mantenimiento Preventivo</option>
              <option value="Airplan">Airplan</option>
              <option value="Responsabilidad Total">Responsabilidad Total</option>
              <option value="Precio Fijo">Precio Fijo</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Zona</label>
            <input type="text" class="form-control" id="zona" placeholder="Zona">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Fecha Inicio</label>
            <input type="date" class="form-control" id="fechaInicio">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Fecha Estimada</label>
            <input type="date" class="form-control" id="fechaEstimada">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Estado</label>
            <select class="form-select" id="estado">
              <option>DETENIDO</option>
              <option>ESPERA REPUESTOS</option>
              <option>EN REPARACION</option>
              <option>PRUEBAS</option>
              <option>PENDIENTE PUESTA EN MARCHA</option>
              <option>OPERATIVO</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Prioridad</label>
            <select class="form-select" id="prioridad">
              <option>ALTA</option>
              <option>MEDIA</option>
              <option>BAJA</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Responsable</label>
            <input type="text" class="form-control" id="responsable" placeholder="Técnico / Ing.">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">% Avance</label>
            <input type="number" class="form-control" id="avance" placeholder="0 - 100" min="0" max="100">
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted mb-1">Falla</label>
            <input type="text" class="form-control" id="falla" placeholder="Descripción de falla">
          </div>
          <div class="col-md-8">
            <label class="form-label small text-muted mb-1">Observaciones</label>
            <input type="text" class="form-control" id="observaciones" placeholder="Notas adicionales">
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary" id="btnGuardar" onclick="guardar()">Agregar Equipo</button>
        </div>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <canvas id="estadoChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <canvas id="clienteChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h5 class="mb-0">Equipos Detenidos</h5>
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" id="buscar" placeholder="Buscar por modelo, serial, cliente..." onkeyup="filtrar()">
          </div>
        </div>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>Modelo</th>
              <th>Serial</th>
              <th>Cliente</th>
              <th>Convenio</th>
              <th>Zona</th>
              <th>Estado</th>
              <th>Prioridad</th>
              <th>Días</th>
              <th>Responsable</th>
              <th>Falla</th>
              <th>Fecha Estimada</th>
              <th>Avance</th>
              <th>Observaciones</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>



    // =========================================================================
    // 1. CONFIGURACIÓN DE SUPABASE (REEMPLAZA CON TUS CREDENCIALES)
    // =========================================================================
    const SUPABASE_URL = "https://tztuhdxkrdkhawknpmci.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";


    const NOMBRE_TABLA = 'equipos_detenidos'; 
    // =========================================================================

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let equipos = [];
    let estadoChart;
    let clienteChart;

    document.addEventListener('DOMContentLoaded', cargarEquipos);

    // LEER DATOS (SELECT)
    async function cargarEquipos() {
      const { data, error } = await supabaseClient
        .from(NOMBRE_TABLA)
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error cargando equipos:', error);
        alert('Error al conectar con Supabase: ' + error.message);
        return;
      }

      equipos = data || [];
      actualizar();
    }

    // CREAR O ACTUALIZAR DATOS (INSERT / UPDATE)
    async function guardar() {
      const modeloVal = document.getElementById('modelo').value.trim();
      if (!modeloVal) {
        alert('El campo Modelo es obligatorio.');
        return;
      }

      const idEdicion = document.getElementById('equipoId').value;
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerText = idEdicion ? 'Actualizando...' : 'Guardando...';

      const registro = {
        modelo: modeloVal,
        serial: document.getElementById('serial').value.trim() || null,
        cliente: document.getElementById('cliente').value.trim() || null,
        tipo_convenio: document.getElementById('tipoConvenio').value.trim() || null,
        zona: document.getElementById('zona').value.trim() || null,
        fecha_inicio: document.getElementById('fechaInicio').value || null,
        fecha_estimada: document.getElementById('fechaEstimada').value || null,
        estado: document.getElementById('estado').value,
        prioridad: document.getElementById('prioridad').value,
        responsable: document.getElementById('responsable').value.trim() || null,
        avance: parseInt(document.getElementById('avance').value) || 0,
        falla: document.getElementById('falla').value.trim() || null,
        observaciones: document.getElementById('observaciones').value.trim() || null
      };

      let error;

      if (idEdicion) {
        registro.fecha_actualizacion = new Date().toISOString();
        const res = await supabaseClient
          .from(NOMBRE_TABLA)
          .update(registro)
          .eq('id', idEdicion);
        error = res.error;
      } else {
        const res = await supabaseClient
          .from(NOMBRE_TABLA)
          .insert([registro]);
        error = res.error;
      }

      btn.disabled = false;

      if (error) {
        btn.innerText = idEdicion ? 'Actualizar Equipo' : 'Agregar Equipo';
        console.error('Error guardando:', error);
        alert('Error al guardar en Supabase: ' + error.message);
        return;
      }

      cancelarEdicion();
      await cargarEquipos();
    }

    // PREPARAR FORMULARIO PARA EDITAR
    function editar(id) {
      const eq = equipos.find(item => item.id === id);
      if (!eq) return;

      document.getElementById('equipoId').value = eq.id;
      document.getElementById('modelo').value = eq.modelo || '';
      document.getElementById('serial').value = eq.serial || '';
      document.getElementById('cliente').value = eq.cliente || '';
      document.getElementById('tipoConvenio').value = eq.tipo_convenio || '';
      document.getElementById('zona').value = eq.zona || '';
      document.getElementById('fechaInicio').value = eq.fecha_inicio || '';
      document.getElementById('fechaEstimada').value = eq.fecha_estimada || '';
      document.getElementById('estado').value = eq.estado || 'DETENIDO';
      document.getElementById('prioridad').value = eq.prioridad || 'ALTA';
      document.getElementById('responsable').value = eq.responsable || '';
      document.getElementById('avance').value = eq.avance ?? 0;
      document.getElementById('falla').value = eq.falla || '';
      document.getElementById('observaciones').value = eq.observaciones || '';

      document.getElementById('tituloFormulario').innerText = 'Editando Equipo #' + eq.id;
      document.getElementById('btnGuardar').innerText = 'Actualizar Equipo';
      document.getElementById('btnGuardar').classList.replace('btn-primary', 'btn-success');
      document.getElementById('btnCancelarEdicion').classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // CANCELAR EDICIÓN Y LIMPIAR FORMULARIO
    function cancelarEdicion() {
      document.getElementById('equipoId').value = '';
      ['modelo', 'serial', 'cliente', 'tipoConvenio', 'zona', 'fechaInicio', 'fechaEstimada', 'responsable', 'avance', 'falla', 'observaciones']
        .forEach(id => document.getElementById(id).value = '');
      
      document.getElementById('estado').value = 'DETENIDO';
      document.getElementById('prioridad').value = 'ALTA';
      document.getElementById('tituloFormulario').innerText = 'Registro de Equipo';
      document.getElementById('btnGuardar').innerText = 'Agregar Equipo';
      document.getElementById('btnGuardar').classList.replace('btn-success', 'btn-primary');
      document.getElementById('btnCancelarEdicion').classList.add('d-none');
    }

    // ELIMINAR REGISTRO (DELETE)
    async function eliminar(id) {
      if (!confirm('¿Estás seguro de eliminar este equipo de la base de datos?')) return;

      const { error } = await supabaseClient
        .from(NOMBRE_TABLA)
        .delete()
        .eq('id', id);

      if (error) {
        console.error('Error eliminando:', error);
        alert('Error al eliminar: ' + error.message);
        return;
      }

      await cargarEquipos();
    }

    // RENDERIZAR TABLA, KPIs Y GRÁFICOS
    function actualizar() {
      const tabla = document.getElementById("tabla");
      tabla.innerHTML = "";
      let criticos = 0;
      let repuestos = 0;
      let entrega = 0;
      const estados = {};
      const clientes = {};

      equipos.forEach(e => {
        const dias = e.fecha_inicio 
          ? Math.max(0, Math.floor((new Date() - new Date(e.fecha_inicio)) / 86400000)) 
          : 0;

        let semaforo = "estado-verde";
        if (dias > 30) {
          semaforo = "estado-rojo";
          criticos++;
        } else if (dias > 15) {
          semaforo = "estado-amarillo";
        }

        if (e.estado === "ESPERA REPUESTOS") repuestos++;

        if (e.fecha_estimada) {
          const diasEntrega = Math.floor((new Date(e.fecha_estimada) - new Date()) / 86400000);
          if (diasEntrega <= 7 && diasEntrega >= 0) entrega++;
        }

        if (e.estado) estados[e.estado] = (estados[e.estado] || 0) + 1;
        if (e.cliente) clientes[e.cliente] = (clientes[e.cliente] || 0) + 1;

        tabla.innerHTML += `
          <tr>
            <td><strong>${e.modelo || ''}</strong></td>
            <td>${e.serial || '-'}</td>
            <td>${e.cliente || '-'}</td>
            <td>${e.tipo_convenio || '-'}</td>
            <td>${e.zona || '-'}</td>
            <td>${e.estado || '-'}</td>
            <td>${e.prioridad || '-'}</td>
            <td><span class="${semaforo}">${dias}</span></td>
            <td>${e.responsable || '-'}</td>
            <td>${e.falla || '-'}</td>
            <td>${e.fecha_estimada || '-'}</td>
            <td>${e.avance ?? 0}%</td>
            <td>${e.observaciones || '-'}</td>
            <td class="text-nowrap">
              <button class="btn btn-sm btn-warning me-1" onclick="editar(${e.id})">Editar</button>
              <button class="btn btn-sm btn-danger" onclick="eliminar(${e.id})">Eliminar</button>
            </td>
          </tr>
        `;
      });

      document.getElementById("kpiTotal").innerText = equipos.length;
      document.getElementById("kpiCriticos").innerText = criticos;
      document.getElementById("kpiRepuestos").innerText = repuestos;
      document.getElementById("kpiEntrega").innerText = entrega;
      generarGraficos(estados, clientes);
    }

    function generarGraficos(estados, clientes) {
      if (estadoChart) estadoChart.destroy();
      estadoChart = new Chart(document.getElementById("estadoChart"), {
        type: "doughnut",
        data: {
          labels: Object.keys(estados),
          datasets: [{ data: Object.values(estados) }]
        },
        options: { plugins: { title: { display: true, text: "Equipos por Estado" } } }
      });

      if (clienteChart) clienteChart.destroy();
      clienteChart = new Chart(document.getElementById("clienteChart"), {
        type: "bar",
        data: {
          labels: Object.keys(clientes),
          datasets: [{ label: "Equipos", data: Object.values(clientes), backgroundColor: "#0d6efd" }]
        },
        options: { plugins: { title: { display: true, text: "Equipos por Cliente" } } }
      });
    }

    function filtrar() {
      const txt = document.getElementById("buscar").value.toLowerCase();
      const filas = document.querySelectorAll("#tabla tr");
      filas.forEach(fila => {
        fila.style.display = fila.innerText.toLowerCase().includes(txt) ? "" : "none";
      });
    }
  </script>
</body>
</html>
