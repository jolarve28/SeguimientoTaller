<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Equipos Detenidos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card-kpi{
    color:white;
    border-radius:18px;
}

.bg-detenido{
    background:linear-gradient(135deg,#0d6efd,#4d8bff);
}

.bg-critico{
    background:linear-gradient(135deg,#dc3545,#ff6b6b);
}

.bg-repuesto{
    background:linear-gradient(135deg,#ffc107,#ffdb70);
    color:#000;
}

.bg-entrega{
    background:linear-gradient(135deg,#198754,#45d48f);
}

.estado-verde{
    background:#198754;
    color:white;
    padding:4px 10px;
    border-radius:8px;
}

.estado-amarillo{
    background:#ffc107;
    color:black;
    padding:4px 10px;
    border-radius:8px;
}

.estado-rojo{
    background:#dc3545;
    color:white;
    padding:4px 10px;
    border-radius:8px;
}

.table-responsive{
    max-height:600px;
}

</style>
</head>

<body>

<div class="container-fluid p-4">

<h2 class="mb-4">
Control de Equipos Detenidos
</h2>

<div class="row mb-4">

<div class="col-md-3">
<div class="card card-kpi bg-detenido">
<div class="card-body">
<h6>Equipos Detenidos</h6>
<h2 id="kpiTotal">0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi bg-critico">
<div class="card-body">
<h6>Críticos (+30 días)</h6>
<h2 id="kpiCriticos">0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi bg-repuesto">
<div class="card-body">
<h6>Espera Repuestos</h6>
<h2 id="kpiRepuestos">0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-kpi bg-entrega">
<div class="card-body">
<h6>Entrega Próxima</h6>
<h2 id="kpiEntrega">0</h2>
</div>
</div>
</div>

</div>

<div class="card mb-4">

<div class="card-header">
<h5>Registro de Equipo</h5>
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-2">
<input type="text" class="form-control" id="modelo" placeholder="Modelo">
</div>

<div class="col-md-2">
<input type="text" class="form-control" id="serial" placeholder="Serial">
</div>

<div class="col-md-2">
<input type="text" class="form-control" id="cliente" placeholder="Cliente">
</div>

<div class="col-md-2">
<input type="text" class="form-control" id="zona" placeholder="Zona">
</div>

<div class="col-md-2">
<input type="date" class="form-control" id="fechaInicio">
</div>

<div class="col-md-2">
<input type="date" class="form-control" id="fechaEstimada">
</div>

<div class="col-md-3">
<select class="form-select" id="estado">
<option>DETENIDO</option>
<option>ESPERA REPUESTOS</option>
<option>EN REPARACION</option>
<option>PRUEBAS</option>
<option>PENDIENTE PUESTA EN MARCHA</option>
<option>OPERATIVO</option>
</select>
</div>

<div class="col-md-3">
<select class="form-select" id="prioridad">
<option>ALTA</option>
<option>MEDIA</option>
<option>BAJA</option>
</select>
</div>

<div class="col-md-3">
<input type="text" class="form-control" id="responsable" placeholder="Responsable">
</div>

<div class="col-md-3">
<input type="number" class="form-control" id="avance" placeholder="% Avance">
</div>

<div class="col-md-3">
<input type="text" class="form-control" id="falla" placeholder="Falla">
</div>

<div class="col-md-9">
<input type="text" class="form-control" id="observaciones" placeholder="Observaciones">
</div>

</div>

<div class="mt-3">
<button class="btn btn-primary" onclick="guardar()">Agregar Equipo</button>
</div>

</div>

</div>

<div class="row mb-4">

<div class="col-md-6">
<div class="card">
<div class="card-body">
<canvas id="estadoChart"></canvas>
</div>
</div>
</div>

<div class="col-md-6">
<div class="card">
<div class="card-body">
<canvas id="clienteChart"></canvas>
</div>
</div>
</div>

</div>

<div class="card">

<div class="card-header">

<div class="row">

<div class="col-md-6">
<h5>Equipos Detenidos</h5>
</div>

<div class="col-md-6">
<input type="text"
class="form-control"
id="buscar"
placeholder="Buscar..."
onkeyup="filtrar()">
</div>

</div>

</div>

<div class="card-body table-responsive">

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>
<th>Modelo</th>
<th>Serial</th>
<th>Cliente</th>
<th>Zona</th>
<th>Estado</th>
<th>Días</th>
<th>Responsable</th>
<th>Falla</th>
<th>Fecha Estimada</th>
<th>Avance</th>
<th>Observaciones</th>
</tr>

</thead>

<tbody id="tabla">
</tbody>

</table>

</div>

</div>

</div>

<script>

let equipos = [];

function guardar(){

const registro = {

modelo: modelo.value,
serial: serial.value,
cliente: cliente.value,
zona: zona.value,

fechaInicio: fechaInicio.value,
fechaEstimada: fechaEstimada.value,

estado: estado.value,
prioridad: prioridad.value,
responsable: responsable.value,

avance: avance.value,

falla: falla.value,

observaciones: observaciones.value

};

equipos.push(registro);

actualizar();

}

function actualizar(){

const tabla =
document.getElementById("tabla");

tabla.innerHTML = "";

let criticos = 0;
let repuestos = 0;
let entrega = 0;

const estados = {};
const clientes = {};

equipos.forEach(e=>{

const dias = Math.floor(
(new Date() -
new Date(e.fechaInicio))
/
86400000
);

let semaforo="estado-verde";

if(dias>30){
semaforo="estado-rojo";
criticos++;
}
else if(dias>15){
semaforo="estado-amarillo";
}

if(e.estado==="ESPERA REPUESTOS")
repuestos++;

const diasEntrega =
Math.floor(
(new Date(e.fechaEstimada)-new Date())
/
86400000
);

if(diasEntrega<=7 && diasEntrega>=0)
entrega++;

estados[e.estado] =
(estados[e.estado]||0)+1;

clientes[e.cliente] =
(clientes[e.cliente]||0)+1;

tabla.innerHTML += `
<tr>

<td>${e.modelo}</td>
<td>${e.serial}</td>
<td>${e.cliente}</td>
<td>${e.zona}</td>

<td>${e.estado}</td>

<td>
<span class="${semaforo}">
${dias}
</span>
</td>

<td>${e.responsable}</td>

<td>${e.falla}</td>

<td>${e.fechaEstimada}</td>

<td>${e.avance}%</td>

<td>${e.observaciones}</td>

</tr>
`;

});

document.getElementById("kpiTotal").innerText =
equipos.length;

document.getElementById("kpiCriticos").innerText =
criticos;

document.getElementById("kpiRepuestos").innerText =
repuestos;

document.getElementById("kpiEntrega").innerText =
entrega;

generarGraficos(estados,clientes);

}

let estadoChart;
let clienteChart;

function generarGraficos(estados,clientes){

if(estadoChart)
estadoChart.destroy();

estadoChart =
new Chart(
document.getElementById("estadoChart"),
{
type:"doughnut",
data:{
labels:Object.keys(estados),
datasets:[{
data:Object.values(estados)
}]
},
options:{
plugins:{
title:{
display:true,
text:"Equipos por Estado"
}
}
}
}
);

if(clienteChart)
clienteChart.destroy();

clienteChart =
new Chart(
document.getElementById("clienteChart"),
{
type:"bar",
data:{
labels:Object.keys(clientes),
datasets:[{
label:"Equipos",
data:Object.values(clientes),
backgroundColor:"#0d6efd"
}]
},
options:{
plugins:{
title:{
display:true,
text:"Equipos por Cliente"
}
}
}
}
);

}

function filtrar(){

const txt =
document.getElementById("buscar")
.value.toLowerCase();

const filas =
document.querySelectorAll("#tabla tr");

filas.forEach(fila=>{

fila.style.display =
fila.innerText
.toLowerCase()
.includes(txt)
?
""
:
"none";

});

}

</script>

</body>
</html>
