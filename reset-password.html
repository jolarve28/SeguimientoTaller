<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nueva Contraseña</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Segoe UI;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#004B87;
    color:white;
}

#msg{
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h2>Nueva Contraseña</h2>

<input
type="password"
id="password"
placeholder="Nueva contraseña">

<input
type="password"
id="confirm"
placeholder="Confirmar contraseña">

<button onclick="actualizarPassword()">
Actualizar Contraseña
</button>

<div id="msg"></div>

</div>

<script>

const supabaseClient =
supabase.createClient(
"https://tztuhdxkrdkhawknpmci.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA");
   


async function actualizarPassword(){

    const token =
        new URLSearchParams(
            window.location.search
        ).get("token");

    const pass =
        document.getElementById("password")
        .value;

    const confirm =
        document.getElementById("confirm")
        .value;

    const msg =
        document.getElementById("msg");

    if(pass !== confirm){

        msg.innerHTML =
        "Las contraseñas no coinciden";

        return;
    }

    const { data:user, error } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq("reset_token", token)
            .single();

    if(error || !user){

        msg.innerHTML =
        "Token inválido";

        return;
    }

    if(
        new Date(user.reset_token_expira)
        < new Date()
    ){

        msg.innerHTML =
        "Token vencido";

        return;
    }

    const {
        error:updateError
    } =
    await supabaseClient
        .from("usuarios")
        .update({
            contraseña: pass,
            reset_token: null,
            reset_token_expira: null
        })
        .eq("email", user.email);

    if(updateError){

        msg.innerHTML =
        updateError.message;

        return;
    }

    msg.style.color =
        "green";

    msg.innerHTML =
        "Contraseña actualizada correctamente";

}

</script>
</body>
</html>
