<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Copco - Nueva Contraseña</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #eef2f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 450px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
    }
    h2 { color: #000; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
    }
    input:focus { outline: none; border-color: #004B87; }
    .btn-submit {
      width: 100%;
      border: none;
      background: #0d4785;
      color: #fff;
      padding: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 5px;
    }
    .btn-submit:hover { background: #093566; }
    #msg { margin-top: 15px; font-weight: 600; font-size: 14px; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Nueva Contraseña</h2>

    <form id="resetForm">
      <div class="form-group">
        <input type="password" id="password" placeholder="Nueva contraseña (mín. 6 caracteres)" minlength="6" required>
      </div>
      <div class="form-group">
        <input type="password" id="confirm" placeholder="Confirmar contraseña" minlength="6" required>
      </div>
      <button type="submit" id="btnGuardar" class="btn-submit">Actualizar Contraseña</button>
    </form>

    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const msgDiv = document.getElementById("msg");
    const btnGuardar = document.getElementById("btnGuardar");

    function mostrarMensaje(texto, tipo) {
      msgDiv.textContent = texto;
      msgDiv.className = tipo;
    }

    // 1. Verificar automáticamente la sesión que viene en el enlace del correo
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
        mostrarMensaje("Correo verificado. Ingresa tu nueva contraseña.", "success");
      }
    });

    // 2. Guardar la nueva contraseña
    document.getElementById("resetForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (pass !== confirm) {
        mostrarMensaje("Las contraseñas no coinciden", "error");
        return;
      }

      // Verificar que exista la sesión temporal autorizada por el correo
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        mostrarMensaje("Token inválido o expirado. Solicita un nuevo enlace desde el inicio de sesión.", "error");
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Actualizando...";

      // Actualizar la contraseña en Supabase Auth
      const { error } = await supabaseClient.auth.updateUser({
        password: pass
      });

      if (error) {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Actualizar Contraseña";
        mostrarMensaje("Error: " + error.message, "error");
        return;
      }

      // Cerrar sesión temporal y redirigir al login
      await supabaseClient.auth.signOut();
      mostrarMensaje("Contraseña actualizada correctamente. Redirigiendo...", "success");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    });
  </script>
</body>
</html>
