<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Préstamo de Herramientas</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

.container{
    background:white;
    max-width:1200px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
    color:#1e3d6b;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:10px 20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#203864;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:8px;
}

img{
    max-width:80px;
}

.miniatura{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:6px;
    border:1px solid #ccc;
    cursor:pointer;
    transition:.3s;
}

.miniatura:hover{
    transform:scale(1.15);
}

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
}

.modal-contenido{
    display:block;
    margin:auto;
    max-width:90%;
    max-height:90%;
    margin-top:20px;
}

.cerrar{
    position:absolute;
    top:10px;
    right:30px;
    color:white;
    font-size:40px;
    font-weight:bold;
    cursor:pointer;
}


</style>
</head>

<body>

<div class="container">

<h1>Registro de Préstamo de Herramientas</h1>

<label>Tipo</label>
<input type="text" id="tipo">

<label>Serial</label>
<input type="text" id="serial">

<label>Fecha Préstamo</label>
<input type="date" id="fechaPrestamo">

<label>Fecha Devolución</label>
<input type="date" id="fechaDevolucion">

<label>Cantidad</label>
<input type="number" id="cantidad">

<label>Encargado</label>
<input type="text" id="encargado">

<label>Responsable</label>
<input type="text" id="responsable">

<label>Jefe Directo</label>
<input type="text" id="jefeDirecto">

<label>Foto</label>
<input type="file" id="foto" accept="image/*">

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<button onclick="guardarPrestamo()">
Guardar Préstamo
</button>

<table>

<thead>
<tr>
<th>Tipo</th>
<th>Serial</th>
<th>Encargado</th>
<th>Responsable</th>
<th>Foto</th>
</tr>
</thead>

<tbody id="tablaPrestamos">
</tbody>

</table>

</div>

<div id="modalImagen" class="modal">

    <span class="cerrar" onclick="cerrarImagen()">
        &times;
    </span>

    <img
        id="imagenAmpliada"
        class="modal-contenido">

</div>
<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* ===================================
   CONFIGURACION SUPABASE
=================================== */

const SUPABASE_URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* ===================================
   SUBIR IMAGEN
=================================== */

async function subirImagen(archivo){

    const extension =
        archivo.name.split('.').pop();

    const nombreArchivo =
        Date.now() + "." + extension;

    const { error } =
        await supabase.storage
        .from('fotos-prestamos')
        .upload(
            nombreArchivo,
            archivo,
            {
                upsert:true
            }
        );

    if(error){
        throw error;
    }

    const { data } =
        supabase.storage
        .from('fotos-prestamos')
        .getPublicUrl(nombreArchivo);

    return data.publicUrl;
}

/* ===================================
   GUARDAR PRESTAMO
=================================== */

window.guardarPrestamo =
async function(){

try{

    let fotoURL = "";

    const archivo =
        document.getElementById("foto")
        .files[0];

    if(archivo){

        fotoURL =
            await subirImagen(
                archivo
            );
    }

    const { error } =
        await supabase
        .from("prestamos")
        .insert([
        {
            tipo:
            document.getElementById("tipo").value,

            serial:
            document.getElementById("serial").value,

            fecha_prestamo:
            document.getElementById("fechaPrestamo").value,

            fecha_devolucion:
            document.getElementById("fechaDevolucion").value,

            cantidad:
            Number(
            document.getElementById("cantidad").value
            ),

            encargado:
            document.getElementById("encargado").value,

            responsable:
            document.getElementById("responsable").value,

            jefe_directo:
            document.getElementById("jefeDirecto").value,

            observaciones:
            document.getElementById("observaciones").value,

            foto_url:
            fotoURL

        }]);

    if(error){
        throw error;
    }

    alert("Préstamo guardado correctamente");

    limpiarFormulario();

    cargarPrestamos();

}
catch(error){

    console.error(error);

    alert(
    "Error: " +
    error.message
    );

}

};

window.verImagen = function(url){

    document.getElementById(
        "imagenAmpliada"
    ).src = url;

    document.getElementById(
        "modalImagen"
    ).style.display = "block";
};

window.cerrarImagen = function(){

    document.getElementById(
        "modalImagen"
    ).style.display = "none";
};

document
.getElementById("modalImagen")
.addEventListener("click", function(e){

    if(e.target === this){

        cerrarImagen();

    }

});

/* ===================================
   CARGAR PRESTAMOS
=================================== */

async function cargarPrestamos(){

    const tbody =
        document.getElementById(
            "tablaPrestamos"
        );

    tbody.innerHTML = "";

    const { data, error } =
    await supabase
    .from("prestamos")
    .select("*")
    .order("id", {
        ascending: false
    });

if(error){

    console.error(error);

    return;
}

data.forEach(p => {

    tbody.innerHTML += `
    <tr>

        <td>${p.tipo || ""}</td>

        <td>${p.serial || ""}</td>

        <td>${p.encargado || ""}</td>

        <td>${p.responsable || ""}</td>

     <td>
    ${
        p.foto_url
        ?
        `<img
            src="${p.foto_url}"
            alt="Foto"
            style="
                width:70px;
                height:70px;
                object-fit:cover;
                border-radius:5px;
                cursor:pointer;
                border:1px solid #ccc;
            "
            onclick="window.open('${p.foto_url}','_blank')"
        >`
        :
        "Sin foto"
    }
</td>

</tr>

`;

}); // <- cierre forEach


} // <- cierre función cargarPrestamos

/* ===================================
   LIMPIAR
=================================== */

function limpiarFormulario(){

    document.getElementById("tipo").value="";
    document.getElementById("serial").value="";
    document.getElementById("fechaPrestamo").value="";
    document.getElementById("fechaDevolucion").value="";
    document.getElementById("cantidad").value="";
    document.getElementById("encargado").value="";
    document.getElementById("responsable").value="";
    document.getElementById("jefeDirecto").value="";
    document.getElementById("observaciones").value="";
    document.getElementById("foto").value="";
}

/* ===================================
   INICIO
=================================== */

cargarPrestamos();

</script>

</body>
</html>
