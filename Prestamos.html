<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* ===================================
   CONFIGURACION SUPABASE
=================================== */

const SUPABASE_URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const PASSWORD_ADMIN = "Atlas2026";


let idEditando = null;
let fotoActual = "";
let accionPendiente = null;
let idPendiente = null;

/* ===================================
   SUBIR IMAGEN
=================================== */

async function subirImagen(archivo){

    const extension =
        archivo.name.split('.').pop();

    const nombreArchivo =
        Date.now() + "." + extension;

    const { error } =
        await supabase.storage
        .from('fotos-prestamos')
        .upload(
            nombreArchivo,
            archivo,
            {
                upsert:true
            }
        );

    if(error){
        throw error;
    }

    const { data } =
        supabase.storage
        .from('fotos-prestamos')
        .getPublicUrl(nombreArchivo);

    return data.publicUrl;
}

window.filtrarTabla = function(){

    const filtro =
        document
        .getElementById("busqueda")
        .value
        .toUpperCase();

    const filas =
        document
        .querySelectorAll(
            "#tablaPrestamos tr"
        );

    filas.forEach(fila => {

        const texto =
            fila.innerText.toUpperCase();

        fila.style.display =
            texto.includes(filtro)
            ? ""
            : "none";

    });

}


window.filtrarEstado = function(tipoFiltro){

    const filas =
        document.querySelectorAll(
            "#tablaPrestamos tr"
        );

    const hoy = new Date();

    filas.forEach(fila => {

        const celdas =
            fila.querySelectorAll("td");

        if(celdas.length === 0) return;

        const estado =
            celdas[9]?.innerText.trim();

        const fechaTexto =
            celdas[4]?.innerText.trim();

        if(tipoFiltro === ""){

            fila.style.display = "";
            return;
        }

        if(tipoFiltro === "Pendiente"){

            fila.style.display =
                estado === "Pendiente"
                ? ""
                : "none";

            return;
        }

        if(tipoFiltro === "Entregado"){

            fila.style.display =
                estado === "Entregado"
                ? ""
                : "none";

            return;
        }

        if(tipoFiltro === "Vencido"){

            const fecha =
                new Date(fechaTexto);

            const vencido =
                estado === "Pendiente" &&
                fecha < hoy;

            fila.style.display =
                vencido
                ? ""
                : "none";

            return;
        }

    });

}



/* ===================================
   GUARDAR PRESTAMO
=================================== */

window.guardarPrestamo = async function(){

    try{

        let fotoURL = fotoActual;

        const archivo =
            document.getElementById("foto").files[0];

        if(archivo){

            fotoURL =
                await subirImagen(archivo);

        }

        const datos = {

            tipo:
                document.getElementById("tipo").value,

            serial:
                document.getElementById("serial").value,

            fecha_prestamo:
                document.getElementById("fechaPrestamo").value,

            fecha_devolucion:
                document.getElementById("fechaDevolucion").value,

            cantidad:
                Number(
                    document.getElementById("cantidad").value
                ),

            encargado:
                document.getElementById("encargado").value,

            responsable:
                document.getElementById("responsable").value,

            jefe_directo:
                document.getElementById("jefeDirecto").value,

            estado:
                document.getElementById("estado").value,

            observaciones:
                document.getElementById("observaciones").value,

            foto_url:
                fotoURL

        };

        let error;

        if(idEditando){

            ({ error } =
                await supabase
                .from("prestamos")
                .update(datos)
                .eq("id", idEditando)
            );

            if(error) throw error;

            alert(
                "Registro actualizado correctamente"
            );

            idEditando = null;

        }else{

            ({ error } =
                await supabase
                .from("prestamos")
                .insert([datos])
            );

            if(error) throw error;

            alert(
                "Préstamo guardado correctamente"
            );

        }

        limpiarFormulario();

        cargarPrestamos();

    }
    catch(error){

        console.error(error);

        alert(
            "Error: " + error.message
        );

    }

};

window.verImagen = function(url){

    document.getElementById(
        "imagenAmpliada"
    ).src = url;

    document.getElementById(
        "modalImagen"
    ).style.display = "block";
};

window.cerrarImagen = function(){

    document.getElementById(
        "modalImagen"
    ).style.display = "none";
};

window.solicitarPassword = function(accion,id){

    accionPendiente = accion;
    idPendiente = id;

    document.getElementById(
        "modalPassword"
    ).style.display = "block";
};

window.cerrarPasswordModal = function(){

    document.getElementById(
        "modalPassword"
    ).style.display = "none";

    document.getElementById(
        "passwordInput"
    ).value = "";

};

window.validarPassword = function(){

    const clave =
    document.getElementById(
        "passwordInput"
    ).value;

    if(clave !== PASSWORD_ADMIN){

        alert("Contraseña incorrecta");
        return;
    }

    cerrarPasswordModal();

    if(accionPendiente === "editar"){

        ejecutarEdicion(idPendiente);

    }

    if(accionPendiente === "eliminar"){

        ejecutarEliminacion(idPendiente);

    }

};

async function ejecutarEdicion(id){

    const { data, error } =
        await supabase
        .from("prestamos")
        .select("*")
        .eq("id", id)
        .single();

    if(error){

        alert(error.message);
        return;

    }

    idEditando = id;

    fotoActual = data.foto_url || "";

    document.getElementById("tipo").value =
        data.tipo || "";

    document.getElementById("serial").value =
        data.serial || "";

    document.getElementById("fechaPrestamo").value =
        data.fecha_prestamo || "";

    document.getElementById("fechaDevolucion").value =
        data.fecha_devolucion || "";

    document.getElementById("cantidad").value =
        data.cantidad || "";

    document.getElementById("encargado").value =
        data.encargado || "";

    document.getElementById("responsable").value =
        data.responsable || "";

    document.getElementById("jefeDirecto").value =
        data.jefe_directo || "";

    document.getElementById("estado").value =
        data.estado || "";

    document.getElementById("observaciones").value =
        data.observaciones || "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}
async function ejecutarEliminacion(id){

    if(!confirm(
        "¿Desea eliminar este registro?"
    )){
        return;
    }

    const { error } =
        await supabase
        .from("prestamos")
        .delete()
        .eq("id",id);

    if(error){

        alert(error.message);
        return;

    }

    alert("Registro eliminado");

    cargarPrestamos();

}


document
.getElementById("modalImagen")
.addEventListener("click", function(e){

    if(e.target === this){

        cerrarImagen();

    }

});

/* ===================================
   CARGAR PRESTAMOS
=================================== */

async function cargarPrestamos(){

    const tbody =
        document.getElementById("tablaPrestamos");

    tbody.innerHTML = "";

    const { data, error } =
        await supabase
        .from("prestamos")
        .select("*")
        .order("id", {
            ascending: false
        });

    if(error){

        console.error(error);
        return;

    }

    data.forEach(p => {

        tbody.innerHTML += `
        <tr>

         <td>${p.id || ""}</td>

<td>${p.tipo || ""}</td>

<td>${p.serial || ""}</td>

<td>${p.fecha_prestamo || ""}</td>

<td>${p.fecha_devolucion || ""}</td>

<td>${p.cantidad || ""}</td>

<td>${p.encargado || ""}</td>

<td>${p.responsable || ""}</td>

<td>${p.jefe_directo || ""}</td>

<td>${p.estado || ""}</td>

<td>${p.observaciones || ""}</td>

   <td>

    ${
        p.foto_url
        ?
        `<img
            src="${p.foto_url}"
            class="miniatura"
            alt="Foto"
            style="
                width:70px;
                height:70px;
                object-fit:cover;
                border-radius:6px;
                cursor:pointer;
            "
            onclick="verImagen('${p.foto_url}')"
        >`
        :
        "Sin foto"
    }

</td>

            <td>

                <button
                    style="background:#ffc107;color:black;"
                    onclick="solicitarPassword('editar',${p.id})">
                    ✏️
                </button>

                <button
                    style="background:#dc3545;"
                    onclick="solicitarPassword('eliminar',${p.id})">
                    🗑️
                </button>

            </td>

        </tr>
        `;

    });

}
/* ===================================
   LIMPIAR
=================================== */
function limpiarFormulario(){

    document.getElementById("tipo").value = "";

    document.getElementById("serial").value = "";

    document.getElementById("fechaPrestamo").value = "";

    document.getElementById("fechaDevolucion").value = "";

    document.getElementById("cantidad").value = "";

    document.getElementById("encargado").value = "";

    document.getElementById("responsable").value = "";

    document.getElementById("jefeDirecto").value = "";

    document.getElementById("estado").value = "Pendiente";

    document.getElementById("observaciones").value = "";

    document.getElementById("foto").value = "";

    // Reinicia variables de edición

    idEditando = null;

    fotoActual = "";

}

/* ===================================
   INICIO
=================================== */

cargarPrestamos();

</script>
