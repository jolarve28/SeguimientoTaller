<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Workshop Tracking Dashboard</title>

"></script>

<style>

body{
    font-family:Segoe UI;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#004B87;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    text-align:center;
}

.kpi span{
    font-size:30px;
    font-weight:bold;
    color:#004B87;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004B87;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

.progress-container{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:24px;
    line-height:24px;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.low{
    background:#dc3545;
}

.mid{
    background:#ff9800;
}

.high{
    background:#28a745;
}

.chart-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>
Atlas Copco Workshop Dashboard
</h1>

</div>

<div class="container">

<div class="kpis">

<div class="kpi">
Total Equipos
<br>
<span id="totalEquipos">0</span>
</div>

<div class="kpi">
En Proceso
<br>
<span id="enProceso">0</span>
</div>

<div class="kpi">
Terminados
<br>
<span id="terminados">0</span>
</div>

<div class="kpi">
Retrasados
<br>
<span id="retrasados">0</span>
</div>

<div class="kpi">
Avance Promedio
<br>
<span id="promedio">0%</span>
</div>

</div>

<div class="card">

<h2>Equipos Registrados</h2>

<table>

<thead>

<tr>

<th>Cliente</th>
<th>Equipo</th>
<th>Estado</th>
<th>Fecha Estimada</th>
<th>Progreso</th>
<th>Observaciones</th>

</tr>

</thead>

<tbody id="tablaEquipos">

</tbody>

</table>

</div>

<div class="chart-grid">

<div class="card">

<h2>
Equipos por Estado
</h2>

<canvas id="graficoEstados"></canvas>

</div>

<div class="card">

<h2>
Equipos por Cliente
</h2>

<canvas id="graficoClientes"></canvas>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

let chartEstados;
let chartClientes;

async function cargarDatos(){

    const response =
    await fetch(

        `${SUPABASE_URL}/rest/v1/equipos?select=*`,

        {

            headers:{

                apikey:SUPABASE_KEY,

                Authorization:
                `Bearer ${SUPABASE_KEY}`

            }

        }

    );

    const datos =
    await response.json();

    mostrarTabla(datos);

    actualizarKPIs(datos);

    crearGraficoEstados(datos);

    crearGraficoClientes(datos);

}

function mostrarTabla(datos){

    const tabla =
    document.getElementById("tablaEquipos");

    tabla.innerHTML = "";

    datos.forEach(item=>{

        let color="high";

        if(item.progreso < 40){
            color="low";
        }
        else if(item.progreso < 80){
            color="mid";
        }

        tabla.innerHTML += `

        <tr>

            <td>${item.cliente || ''}</td>

            <td>${item.equipo || ''}</td>

            <td>${item.estado || ''}</td>

            <td>${item.fecha_estimada || ''}</td>

            <td>

                <div class="progress-container">

                    <div
                    class="progress-bar ${color}"
                    style="width:${item.progreso}%">

                    ${item.progreso}%

                    </div>

                </div>

            </td>

            <td>${item.observaciones || ''}</td>

        </tr>

        `;
    });

}

function actualizarKPIs(datos){

    const total =
    datos.length;

    const terminados =
    datos.filter(
      x=>x.estado==="Entregado"
    ).length;

    const proceso =
    total - terminados;

    const retrasados =
    datos.filter(x=>{

        if(!x.fecha_estimada)
            return false;

        return (

            new Date(x.fecha_estimada)
            <
            new Date()

            &&

            x.estado!=="Entregado"

        );

    }).length;

    const promedio =
    total > 0

    ?

    Math.round(

    datos.reduce(
      (a,b)=>a+(b.progreso||0),0
    ) / total

    )

    :

    0;

    totalEquipos.innerText =
    total;

    enProceso.innerText =
    proceso;

    terminados.innerText =
    terminados;

    retrasados.innerText =
    retrasados;

    promedio.innerText =
    promedio + "%";

}

function crearGraficoEstados(datos){

    const estados = {};

    datos.forEach(x=>{

        estados[x.estado] =

        (estados[x.estado] || 0)

        + 1;

    });

    if(chartEstados){

        chartEstados.destroy();

    }

    chartEstados =

    new Chart(

        document.getElementById(
        "graficoEstados"
        ),

        {

            type:"doughnut",

            data:{

                labels:
                Object.keys(estados),

                datasets:[{

                    data:
                    Object.values(estados)

                }]

            }

        }

    );

}

function crearGraficoClientes(datos){

    const clientes = {};

    datos.forEach(x=>{

        clientes[x.cliente] =

        (clientes[x.cliente] || 0)

        + 1;

    });

    if(chartClientes){

        chartClientes.destroy();

    }

    chartClientes =

    new Chart(

        document.getElementById(
        "graficoClientes"
        ),

        {

            type:"bar",

            data:{

                labels:
                Object.keys(clientes),

                datasets:[{

                    label:
                    "Equipos",

                    data:
                    Object.values(clientes),

                    backgroundColor:
                    "#004B87"
                }]

            }

        }

    );

}

cargarDatos();

</script>

</body>

</html>
