<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas Copco - Seguimiento Taller</title>

<style>

body{
    font-family:Segoe UI,Arial;
    margin:0;
    background:#f5f6f8;
}

.header{
    background:#004B87;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.kpi span{
    display:block;
    font-size:32px;
    font-weight:bold;
    color:#004B87;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.btn-save{
    background:#28a745;
}

.btn-edit{
    background:#007bff;
}

.btn-delete{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004B87;
    color:white;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

.progress{
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    color:white;
    text-align:center;
    font-size:12px;
    line-height:24px;
    height:24px;
}

.low{
    background:#dc3545;
}

.mid{
    background:#ff9800;
}

.high{
    background:#28a745;
}

</style>

</head>

<body>

<div class="header">
<h1>Atlas Copco Taller</h1>
</div>

<div class="container">

<div class="kpis">

<div class="kpi">
Total Equipos
<span id="kpiTotal">0</span>
</div>

<div class="kpi">
En Proceso
<span id="kpiProceso">0</span>
</div>

<div class="kpi">
Terminados
<span id="kpiTerminados">0</span>
</div>

<div class="kpi">
Retrasados
<span id="kpiRetrasados">0</span>
</div>

</div>

<div class="card">

<h2 id="tituloFormulario">Nuevo Registro</h2>

<div class="grid">

<input id="cliente" placeholder="Cliente">

<input id="equipo" placeholder="Equipo">

<input id="serial" placeholder="Serial">

<select id="status">

<option>Recepcionado</option>
<option>Diagnóstico</option>
<option>Esperando Repuestos</option>
<option>En Reparación</option>
<option>Pruebas</option>
<option>Listo para Entrega</option>
<option>Entregado</option>

</select>

<input type="date" id="fecha">

<input
type="number"
id="progreso"
min="0"
max="100"
placeholder="Progreso %">

</div>

<br>

<textarea
id="observaciones"
rows="4"
placeholder="Observaciones"></textarea>

<br><br>

<button
id="btnGuardar"
class="btn-save"
onclick="guardarRegistro()">

Guardar Registro

</button>

</div>

<div class="card">

<input
id="buscar"
placeholder="Buscar..."
onkeyup="filtrarTabla()">

</div>

<div class="card">

<table>

<thead>

<tr>
<th>Cliente</th>
<th>Equipo</th>
<th>Serial</th>
<th>Status</th>
<th>Fecha</th>
<th>Progreso</th>
<th>Observaciones</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

let editando = null;

function headers(){

    return {

        apikey:APIKEY,

        Authorization:
        `Bearer ${APIKEY}`

    };
}

async function cargarDatos(){

    const response =
    await fetch(

        `${URL}/rest/v1/equipos?select=*`,

        {
            headers:headers()
        }

    );

    const datos =
    await response.json();

    mostrarTabla(datos);

    actualizarKPIs(datos);
}

async function guardarRegistro(){

    const registro = {

        cliente:cliente.value,

        equipo:equipo.value,

        serial:serial.value,

        status:status.value,

        fecha_estimada:fecha.value,

        progreso:Number(progreso.value),

        observaciones:observaciones.value

    };

    if(editando){

        await fetch(

            `${URL}/rest/v1/equipos?id=eq.${editando}`,

            {

                method:"PATCH",

                headers:{
                    ...headers(),
                    "Content-Type":"application/json"
                },

                body:
                JSON.stringify(registro)

            }

        );

        editando = null;

        btnGuardar.innerText =
        "Guardar Registro";

        tituloFormulario.innerText =
        "Nuevo Registro";
    }
    else{

        await fetch(

            `${URL}/rest/v1/equipos`,

            {

                method:"POST",

                headers:{
                    ...headers(),
                    "Content-Type":"application/json"
                },

                body:
                JSON.stringify(registro)

            }

        );
    }

    limpiarFormulario();

    cargarDatos();
}

async function editar(id){

    const response =
    await fetch(

        `${URL}/rest/v1/equipos?id=eq.${id}`,

        {

            headers:headers()

        }

    );

    const datos =
    await response.json();

    const r = datos[0];

    editando = id;

    cliente.value = r.cliente;
    equipo.value = r.equipo;
    serial.value = r.serial;
    status.value = r.status;
    fecha.value = r.fecha_estimada;
    progreso.value = r.progreso;
    observaciones.value = r.observaciones;

    btnGuardar.innerText =
    "Actualizar";

    tituloFormulario.innerText =
    "Editar Registro";
}

async function eliminar(id){

    if(!confirm("¿Eliminar registro?"))
        return;

    await fetch(

        `${URL}/rest/v1/equipos?id=eq.${id}`,

        {

            method:"DELETE",

            headers:headers()

        }

    );

    cargarDatos();
}

function mostrarTabla(datos){

    tabla.innerHTML = "";

    datos.forEach(r=>{

        let color = "high";

        if(r.progreso < 40){

            color = "low";

        }else if(r.progreso < 80){

            color = "mid";
        }

        tabla.innerHTML += `

        <tr>

        <td>${r.cliente}</td>
        <td>${r.equipo}</td>
        <td>${r.serial}</td>
        <td>${r.status}</td>
        <td>${r.fecha_estimada || ""}</td>

        <td>

            <div class="progress">

                <div
                class="progress-bar ${color}"
                style="width:${r.progreso}%">

                ${r.progreso}%

                </div>

            </div>

        </td>

        <td>${r.observaciones || ""}</td>

        <td>

            <button
            class="btn-edit"
            onclick="editar(${r.id})">

            Editar

            </button>

            <button
            class="btn-delete"
            onclick="eliminar(${r.id})">

            Eliminar

            </button>

        </td>

        </tr>

        `;
    });
}

function actualizarKPIs(datos){

    const total =
    datos.length;

    const terminados =
    datos.filter(
        x=>x.status==="Entregado"
    ).length;

    const proceso =
    total - terminados;

    const retrasados =
    datos.filter(x=>

        x.fecha_estimada &&
        x.status!=="Entregado" &&
        new Date(x.fecha_estimada) <
        new Date()

    ).length;

    kpiTotal.innerText =
    total;

    kpiProceso.innerText =
    proceso;

    kpiTerminados.innerText =
    terminados;

    kpiRetrasados.innerText =
    retrasados;
}

function limpiarFormulario(){

    cliente.value="";
    equipo.value="";
    serial.value="";
    fecha.value="";
    progreso.value="";
    observaciones.value="";

    status.selectedIndex=0;
}

function filtrarTabla(){

    const texto =
    buscar.value.toLowerCase();

    const filas =
    document.querySelectorAll(
        "#tabla tr"
    );

    filas.forEach(fila=>{

        fila.style.display =

        fila.innerText
        .toLowerCase()
        .includes(texto)

        ? ""

        : "none";

    });
}

cargarDatos();

</script>

</body>
</html>
