<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seguimiento Taller</title>



<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#004B87;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.kpi{
    background:white;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.kpi h3{
    margin:0;
}

.kpi span{
    font-size:30px;
    font-weight:bold;
    color:#004B87;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.btn-save{
    background:#28a745;
}

.btn-edit{
    background:#007bff;
}

.btn-delete{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004B87;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

.progress{
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:24px;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-align:center;
    line-height:24px;
}

.low{
    background:#dc3545;
}

.mid{
    background:#ff9800;
}

.high{
    background:#28a745;
}

.badge{
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

canvas{
    max-height:350px;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="header">
<h1>Atlas Copco Taller</h1>
</div>

<div class="container">

<div class="kpis">

<div class="kpi">
<h3>Total Equipos</h3>
<span id="kpiTotal">0</span>
</div>

<div class="kpi">
<h3>En Proceso</h3>
<span id="kpiProceso">0</span>
</div>

<div class="kpi">
<h3>Terminados</h3>
<span id="kpiTerminados">0</span>
</div>

<div class="kpi">
<h3>Retrasados</h3>
<span id="kpiRetrasados">0</span>
</div>

</div>

<div class="card">

<h2 id="tituloFormulario">Nuevo Registro</h2>

<div class="grid">

<input id="cliente" placeholder="Cliente">

<input id="equipo" placeholder="Equipo">

<input id="serial" placeholder="Serial">

<select id="estado">
    <option>Recepcionado</option>
    <option>Diagnóstico</option>
    <option>Esperando Repuestos</option>
    <option>En Reparación</option>
    <option>Pruebas</option>
    <option>Listo para Entrega</option>
    <option>Entregado</option>
</select>

<input type="date" id="fecha">

<input
type="number"
id="progreso"
placeholder="Progreso %"
min="0"
max="100">

</div>

<br>

<textarea
id="observaciones"
rows="3"
placeholder="Observaciones"></textarea>

<br><br>

<button
id="btnGuardar"
class="btn-save"
onclick="guardarEquipo()">

Guardar Registro

</button>

</div>

<div class="card">

<input
id="buscar"
placeholder="Buscar..."
onkeyup="filtrar()">

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Cliente</th>
<th>Equipo</th>
<th>Serial</th>
<th>estado</th>
<th>Fecha</th>
<th>Progreso</th>
<th>Observaciones</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<div class="card">

<h3>Equipos por Estado</h3>

<canvas id="grafico"></canvas>




</div>

</div>
<script src="https://cdn.jsdelivrt.js

const cliente = document.getElementById("cliente");
const equipo = document.getElementById("equipo");
const serial = document.getElementById("serial");
const estado = document.getElementById("estado");
const fecha = document.getElementById("fecha");
const progreso = document.getElementById("progreso");
const observaciones = document.getElementById("observaciones");

const tabla = document.getElementById("tabla");
const buscar = document.getElementById("buscar");

const btnGuardar = document.getElementById("btnGuardar");
const tituloFormulario = document.getElementById("tituloFormulario");

const kpiTotal = document.getElementById("kpiTotal");
const kpiProceso = document.getElementById("kpiProceso");
const kpiTerminados = document.getElementById("kpiTerminados");
const kpiRetrasados = document.getElementById("kpiRetrasados");




<script>

const URL =
"https://tztuhdxkrdkhawknpmci.supabase.co";

const APIKEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6dHVoZHhrcmRraGF3a25wbWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTEwNDUsImV4cCI6MjEwMDkyNzA0NX0.Vgi5ZUffRo0i3zTnFuag3Dw7MUoJfyt3IWiD0de6_OA";

let grafico = null;

let registroEditando = null;

function getHeaders(){

    return {

        apikey: APIKEY,

        Authorization:
        `Bearer ${APIKEY}`

    };

}

async function cargarEquipos(){

    const response =
    await fetch(

        URL + "/rest/v1/equipos?select=*",

        {

            headers:getHeaders()

        }

    );

    const datos =
    await response.json();

    mostrarTabla(datos);

    actualizarKPIs(datos);

    actualizarGrafico(datos);

}

async function guardarEquipo(){

    const registro = {

        cliente: cliente.value,
        equipo: equipo.value,
        serial: serial.value,
        estado: estado.value,
        fecha_estimada: fecha.value,
        progreso: Number(progreso.value),
        observaciones: observaciones.value

    };

    if(registroEditando){

        await fetch(

            URL +
            "/rest/v1/equipos?id=eq." +
            registroEditando,

            {

                method:"PATCH",

                headers:{
                    ...getHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(registro)

            }

        );

        registroEditando = null;

        btnGuardar.innerText =
        "Guardar Registro";

        tituloFormulario.innerText =
        "Nuevo Registro";

    }

    else{

        await fetch(

            URL + "/rest/v1/equipos",

            {

                method:"POST",

                headers:{
                    ...getHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(registro)

            }

        );

    }

    limpiarFormulario();

    cargarEquipos();

}

async function editar(id){

    const response =
    await fetch(

        URL +
        "/rest/v1/equipos?id=eq." +
        id,

        {

            headers:getHeaders()

        }

    );

    const datos =
    await response.json();

    const r = datos[0];

    registroEditando = id;

    cliente.value = r.cliente;
    equipo.value = r.equipo;
    serial.value = r.serial;
    estado.value = r.estado;
    fecha.value = r.fecha_estimada;
    progreso.value = r.progreso;
    observaciones.value = r.observaciones;

    btnGuardar.innerText =
    "Actualizar";

    tituloFormulario.innerText =
    "Editar Registro";

}

async function eliminar(id){

    if(!confirm("Eliminar registro?"))
        return;

    await fetch(

        URL +
        "/rest/v1/equipos?id=eq." +
        id,

        {

            method:"DELETE",

            headers:getHeaders()

        }

    );

    cargarEquipos();

}

function limpiarFormulario(){

    cliente.value="";
    equipo.value="";
    serial.value="";
    fecha.value="";
    progreso.value="";
    observaciones.value="";
    estado.selectedIndex=0;

}

function mostrarTabla(datos){

    tabla.innerHTML="";

    datos.forEach(r=>{

        let color="high";

        if(r.progreso<40)
            color="low";
        else if(r.progreso<80)
            color="mid";

        tabla.innerHTML += `

        <tr>

        <td>${r.cliente}</td>

        <td>${r.equipo}</td>

        <td>${r.serial}</td>

        <td>${r.estado}</td>

        <td>${r.fecha_estimada}</td>

        <td>

        <div class="progress">

            <div
            class="progress-bar ${color}"
            style="width:${r.progreso}%">

            ${r.progreso}%

            </div>

        </div>

        </td>

        <td>${r.observaciones}</td>

        <td>

        <button
        class="btn-edit"
        onclick="editar(${r.id})">

        Editar

        </button>

        <button
        class="btn-delete"
        onclick="eliminar(${r.id})">

        Eliminar

        </button>

        </td>

        </tr>

        `;

    });

}

function actualizarKPIs(datos){

    kpiTotal.innerText =
    datos.length;

    kpiTerminados.innerText =
    datos.filter(
        x=>x.estado==="Entregado"
    ).length;

    kpiProceso.innerText =
    datos.filter(
        x=>x.estado!=="Entregado"
    ).length;

    let hoy = new Date();

    kpiRetrasados.innerText =
    datos.filter(x=>

        x.estado!=="Entregado"

        &&

        x.fecha_estimada

        &&

        new Date(x.fecha_estimada)<hoy

    ).length;

}

function actualizarGrafico(datos){

    let estados = {};

    datos.forEach(x=>{

        estados[x.estado] =
        (estados[x.estado]||0)+1;

    });

    if(grafico)
        grafico.destroy();

    grafico =
    new Chart(

        document.getElementById("grafico"),

        {

            type:"doughnut",

            data:{

                labels:
                Object.keys(estados),

                datasets:[{

                    data:
                    Object.values(estados)

                }]

            }

        }

    );

}

function filtrar(){

    const texto =
    buscar.value.toLowerCase();

    document
    .querySelectorAll("#tabla tr")
    .forEach(fila=>{

        fila.style.display =

        fila.innerText
        .toLowerCase()
        .includes(texto)

        ? ""

        : "none";

    });

}

cargarEquipos();

</script>

</body>
</html>
